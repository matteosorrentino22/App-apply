<!doctype html>
<html lang="it">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Onboarding — preferenze</title>
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
.stretch::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0}
</style>
</head>
<body>
<div style="position:relative;width:390px;height:960px;box-sizing:border-box;background:#fdfbf7;color:#2b2317;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden">
<div style="flex:1;min-height:0;padding:20px 16px 0;display:flex;flex-direction:column;gap:16px;overflow:hidden">
<div style="display:flex;gap:8px"><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:4px;border-radius:2px;background:#6b4a2e"></div><span style="font-size:12px;font-weight:700;color:#2b2317">Preferenze</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:4px;border-radius:2px;background:#e3dac8"></div><span style="font-size:12px;font-weight:500;color:#6f6350">Profilo</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:4px;border-radius:2px;background:#e3dac8"></div><span style="font-size:12px;font-weight:500;color:#6f6350">Ricerca</span></div></div><h1 style="margin:0;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-0.02em;font-size:24px">Configura il tuo profilo</h1><label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:#4a3a26">Nome</span><input type="text" value="" placeholder="" style="border:1px solid #e0d4bd;border-radius:12px;background:#ffffff;color:#2b2317;font-size:16px;box-sizing:border-box;width:100%;outline:0;height:48px;padding:0 14px"></label><label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:#4a3a26">Cognome</span><input type="text" value="" placeholder="" style="border:1px solid #e0d4bd;border-radius:12px;background:#ffffff;color:#2b2317;font-size:16px;box-sizing:border-box;width:100%;outline:0;height:48px;padding:0 14px"></label><label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:#4a3a26">Situazione / obiettivo attuale</span><textarea style="border:1px solid #e0d4bd;border-radius:12px;background:#ffffff;color:#2b2317;font-size:16px;box-sizing:border-box;width:100%;outline:0;padding:12px 14px;min-height:84px;line-height:1.45;resize:none" placeholder="Es. in transizione verso ruoli di Project Management"></textarea></label><div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:#4a3a26">Fuso orario</span><button type="button" aria-haspopup="listbox" aria-label="Europe/Rome" style="display:flex;align-items:center;justify-content:space-between;gap:8px;height:48px;width:100%;box-sizing:border-box;padding:0 14px;border:1px solid #e0d4bd;border-radius:12px;background:#ffffff;color:#2b2317;font-size:16px">Europe/Rome<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6f6350" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;"><path d="m6 9 6 6 6-6"/></svg></button><p style="margin:0;font-size:12px;line-height:1.45;color:#6f6350;">Decide il giorno “oggi” della lista e delle statistiche e l’ora della notifica del mattino (10:00).</p></div><div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:#4a3a26">Template CV</span><div style="height:48px;display:flex;align-items:center;padding:0 14px;border-radius:12px;background:#f3ecdf;color:#6f6350;font-size:15px">Standard</div></div><div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:600;color:#4a3a26">Lingua del CV generato</span><button type="button" role="radio" aria-checked="true" style="display:flex;align-items:center;gap:12px;width:100%;min-height:52px;box-sizing:border-box;padding:0 14px;text-align:left;border:1.5px solid #6b4a2e;border-radius:12px;background:#fbf6ec;color:#2b2317;font-size:15px;font-weight:600"><span style="flex:none;width:22px;height:22px;box-sizing:border-box;border-radius:11px;border:2px solid #6b4a2e;display:flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:5px;background:#6b4a2e"></span></span><span>Segue la lingua dell'offerta</span></button><button type="button" role="radio" aria-checked="false" style="display:flex;align-items:center;gap:12px;width:100%;min-height:52px;box-sizing:border-box;padding:0 14px;text-align:left;border:1px solid #e0d4bd;border-radius:12px;background:#ffffff;color:#2b2317;font-size:15px;font-weight:600"><span style="flex:none;width:22px;height:22px;box-sizing:border-box;border-radius:11px;border:2px solid #cbb58c;display:flex;align-items:center;justify-content:center"></span><span>Sempre in inglese</span></button></div><button type="button" role="checkbox" aria-checked="false" style="display:flex;align-items:flex-start;gap:12px;min-height:44px;padding:0;border:0;background:transparent;text-align:left;color:#2b2317;font-size:15px;line-height:1.4"><span style="flex:none;width:24px;height:24px;box-sizing:border-box;border-radius:7px;border:2px solid #cbb58c;background:#fff"></span><span style="padding-top:2px">Includi la foto nel CV</span></button>
</div>
<div style="flex:none;padding:12px 16px 28px;border-top:1px solid #ebe2d1;background:#ffffff;display:flex;gap:10px;align-items:center"><button type="button" style="height:52px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;font-size:16px;font-weight:700;text-decoration:none;box-sizing:border-box;border:0;background:#6b4a2e;color:#ffffff;">Avanti</button></div>

</div>
</body>
</html>
