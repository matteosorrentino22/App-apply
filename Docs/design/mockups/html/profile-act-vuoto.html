<title>Profilo — nessuna attività</title>
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
input::placeholder{color:#6f6350}
</style>

<body>
<div style="position:relative;width:390px;height:320px;box-sizing:border-box;background:#fdfbf7;color:#2b2317;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden"><div style="padding:16px;display:flex;flex-direction:column;gap:12px"><section style="background:#fff;border:1px solid #ebe2d1;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:baseline;justify-content:space-between"><span style="font-size:13px;font-weight:600;color:#4a3a26">Attività</span><span style="font-size:12px;color:#6f6350">0 / 15</span></div><p style="margin:0;font-size:14px;color:#6f6350">Nessuna attività inserita.</p><input type="text" aria-label="Nuova attività" placeholder="Scrivi un’attività e premi Invio" style="border:1px solid #e0d4bd;border-radius:12px;background:#ffffff;color:#2b2317;font-size:16px;box-sizing:border-box;width:100%;outline:0;height:48px;padding:0 14px"><p style="margin:0;font-size:12px;line-height:1.45;color:#6f6350">Al massimo 15 attività per ruolo, ciascuna fino a 400 caratteri.</p></section></div></div>
