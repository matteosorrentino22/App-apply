<!doctype html>
<html lang="it">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Onboarding — ricerca</title>
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
.stretch::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0}
</style>
</head>
<body>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#fdfbf7;color:#2b2317;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden">
<div style="flex:1;min-height:0;padding:20px 16px 0;display:flex;flex-direction:column;gap:16px;overflow:hidden">
<div style="display:flex;gap:8px"><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:4px;border-radius:2px;background:#6b4a2e"></div><span style="font-size:12px;font-weight:500;color:#6f6350">Preferenze</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:4px;border-radius:2px;background:#6b4a2e"></div><span style="font-size:12px;font-weight:500;color:#6f6350">Profilo</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:4px;border-radius:2px;background:#6b4a2e"></div><span style="font-size:12px;font-weight:700;color:#2b2317">Ricerca</span></div></div><h1 style="margin:0;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-0.02em;font-size:24px">Crea la tua prima ricerca</h1><p style="margin:-6px 0 0;font-size:14px;line-height:1.5;color:#6f6350">Sarà attiva subito: la useremo ogni volta che avvii una raccolta.</p><div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:#4a3a26">Tipo di ricerca</span><div role="tablist" style="display:flex;gap:2px;padding:4px;border-radius:12px;background:#f3ecdf"><button type="button" style="flex:1;height:32px;border:0;border-radius:9px;font-size:14px;background:#ffffff;color:#2b2317;font-weight:700;box-shadow:0 1px 3px rgba(43,35,23,0.15);">Ruolo</button><button type="button" style="flex:1;height:32px;border:0;border-radius:9px;font-size:14px;background:transparent;color:#6f6350;font-weight:600;">Azienda</button></div></div><label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:#4a3a26">Parole chiave</span><input type="text" value="" placeholder="Es. Project Manager" style="border:1px solid #e0d4bd;border-radius:12px;background:#ffffff;color:#2b2317;font-size:16px;box-sizing:border-box;width:100%;outline:0;height:48px;padding:0 14px"></label><label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:#4a3a26">Città</span><div style="display:flex;align-items:center;gap:8px;height:48px;border:1px solid #e0d4bd;border-radius:12px;background:#ffffff;color:#2b2317;font-size:16px;box-sizing:border-box;width:100%;outline:0;padding:0 12px;color:#6f6350"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><input type="text" value="" placeholder="Es. Zurich" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:#2b2317"></div></label><label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:#4a3a26">Paese</span><input type="text" value="" placeholder="Es. Switzerland" style="border:1px solid #e0d4bd;border-radius:12px;background:#ffffff;color:#2b2317;font-size:16px;box-sizing:border-box;width:100%;outline:0;height:48px;padding:0 14px"></label>
</div>
<div style="flex:none;padding:12px 16px 28px;border-top:1px solid #ebe2d1;background:#ffffff;display:flex;gap:10px;align-items:center"><button type="button" style="height:52px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;font-size:16px;font-weight:700;text-decoration:none;box-sizing:border-box;border:0;background:#6b4a2e;color:#ffffff;">Vai alla lista</button></div>

</div>
</body>
</html>
