# Rotazione dei log Docker per tutti i servizi (Sprint 66): senza, i log
# json-file crescono senza limite sul disco del VPS. Al massimo 5 file da
# 10 MB per container; i log applicativi non contengono token né firme.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    logging: *default-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    logging: *default-logging
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    logging: *default-logging
    build: ./backend
    # --timeout 1800: la raccolta manuale scora in sincrono dentro la
    # richiesta HTTP un batch fino a 100 job (apps/jobs/scoring.py, pool di
    # thread SCORING_CONCURRENCY=5 sulle chiamate Bedrock) — con 120s
    # osservato in produzione un worker ucciso a metà da gunicorn con
    # SystemExit non catturabile da `except Exception`, job restanti senza
    # punteggio (Sprint 45). Stesso rischio, causa diversa, già noto per la
    # generazione CV/cover letter (Sprint 44). --workers 4 (da 3): con
    # richieste che possono restare in corso a lungo, più worker liberi
    # riducono il rischio che due utenti in contemporanea saturino il pool
    # (costo RAM osservato trascurabile, ~65MB/worker su questo VPS).
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 1800"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/mediafiles
      # Backup locali ruotati (Sprint 67): scritti dal task backup_database
      # nel worker, letti da restore_backup; mai serviti da Caddy.
      - local_backups:/app/backups
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    logging: *default-logging
    build: ./backend
    command: celery -A config worker -l info
    volumes:
      - media_data:/app/mediafiles
      - local_backups:/app/backups
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    logging: *default-logging
    build: ./backend
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Servizio "one-shot": produce la build statica della PWA nel volume
  # `frontend_dist`, poi termina. Nessun processo Node in produzione — a
  # differenza di docker-compose.yml (dev), qui la PWA è servita come file
  # statici direttamente da Caddy (02-specifiche-tecniche-v3.md §8.2, §8.3).
  frontend-build:
    logging: *default-logging
    build: ./frontend
    command: sh -c "npm run build && rm -rf /dist/* && cp -r dist/. /dist/"
    volumes:
      - frontend_dist:/dist
    environment:
      VITE_BACKEND_URL: ""

  caddy:
    logging: *default-logging
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
      # Stesso valore letto da Django (.env): Caddy inoltra a web solo quel path.
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:-admin/}
    # Niente volume media_data (Sprint 66): CV, cover letter e foto si
    # scaricano solo dagli URL firmati di Django, mai da Caddy.
    volumes:
      - ./docker/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - frontend_dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
      # Access log JSON, conservati 14 giorni (Caddyfile.prod).
      - caddy_logs:/var/log/caddy
    depends_on:
      web:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  static_data:
  media_data:
  frontend_dist:
  caddy_data:
  caddy_config:
  caddy_logs:
  local_backups:
